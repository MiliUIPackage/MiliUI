name: checks

# 這個 repo 就是一份實際的 Interface/ 資料夾，玩家直接 clone 下來用 ——
# 「發佈」等於 push，所以把關只能在 push 之前。遊戲裡沒有測試可跑，語法錯誤要到
# 登入時才會炸，而且錯誤訊息常常指向不相干的地方（見 .claude/notes/wow-luac-global-scan.md）。
#
# 這些檢查跟本機 `bash .claude/scripts/check-all.sh` 跑的是同一批腳本（notes 同步那道要 agent memory，CI 上沒有）。

on:
  push:
    branches: [master, beta, "ptr-*"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # third-party-manifest.py 要從 git log 算「最近同步」

      # ⚠ 版本要跟開發機一致（本機是 brew 的 lua 5.5.0）。
      #   apt 的 lua5.4 也編得過大部分檔案，但 `luac -l` 的位元組碼列表格式在版本之間
      #   會變，而全域洩漏檢查是靠解析那個輸出的 —— 版本不同會靜默少抓。
      - name: Cache Lua
        id: cache-lua
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: lua-5.5.0-${{ runner.os }}

      - name: Build Lua 5.5.0
        if: steps.cache-lua.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://www.lua.org/ftp/lua-5.5.0.tar.gz -o lua.tar.gz
          tar xf lua.tar.gz
          cd lua-5.5.0
          make -j"$(nproc)" linux
          make install INSTALL_TOP="$HOME/.local"

      - name: Add Lua to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: luac -v

      - name: Lua — 語法與可疑的全域寫入
        run: python3 .claude/scripts/check_lua.py

      # Cell 是本地分支：每支檔的主 chunk 都有 Lua 200 個 local 的硬上限（超過整支不載入，UnitButton.lua 卡過），
      # 另外 5.1 的 upvalue 上限 60 本機 luac 5.5 編譯時不會報，這支自己數
      - name: Cell — 語法／主 chunk local 餘裕／upvalue
        run: python3 .claude/scripts/check_cell.py

      - name: TOC — 載入清單與 Interface 版本
        run: python3 .claude/scripts/check_toc.py

      - name: 語系 — 缺鍵／重複／格式符／色碼
        run: python3 .claude/scripts/check_locales.py

      # vendor 包最怕的就是「改了來源忘了同步」，所以這道一定要在 CI 上
      - name: 共用層 — MiliUIWidgets 有沒有漂移
        run: python3 .claude/scripts/sync-widgets.py --check

      - name: Skin — 契約 lint
        run: python3 .claude/scripts/check_skin.py

      # MiliUI_CooldownManager 是唯一有離線測試的插件（WoW API 用環境表 stub），用 PATH 上的 lua 5.5 跑
      - name: 冷卻管理器 — 離線測試
        run: bash .claude/scripts/run_tests.sh

      # 第三方插件的本地修補被 `update: <插件>` 整包覆蓋時不會報錯，只是某個修好的問題悄悄回來；
      # 清單與辨識法對照 .claude/notes/project-local-addon-forks.md（pending 的是已知退化，只警告不擋）
      - name: 第三方修補 — 有沒有被上游更新洗掉
        run: python3 .claude/scripts/check_forks.py

      # THIRD_PARTY.md 的版本與同步日期是從 TOC 與 git log 算的，update: 之後忘了重新產生就會過期
      - name: 第三方清單 — THIRD_PARTY.md 有沒有過期
        run: python3 .claude/scripts/third-party-manifest.py --check

      # notes/README.md 底下的「全部筆記」是從 frontmatter 產生的，新增筆記沒重跑就會漏篇
      - name: 筆記索引 — notes/README.md 自動區塊
        run: python3 .claude/scripts/notes-index.py --check
